# Legislative watcher — source registry
#
# Each source normalizes to Items via one of four adapters (see src/watcher/adapters/).
# Config knobs, per plan Phase 1:
#   id         unique short slug (also the state-file key)
#   type       congress_api | rss | html_diff | structured
#   chamber    house | senate | joint
#   url        endpoint for RSS / html_diff / structured; base for congress_api
#   params     adapter-specific dict:
#              - congress_api: {mode: poller|tracked, congress: 119, [type, number]}
#              - structured:   {subtype: meeting_feed|floor_lookahead}
#   selectors  html_diff / floor_lookahead: {entry, title, link, date}
#   enabled    default true; set false with a comment when a page resists diffing
#
# Sources that need live selector-hunting are shipped with `enabled: false` and a
# TODO comment — the plan explicitly says disable-with-comment rather than burning
# the smoke run on markup-drift. Populate/enable them one at a time in follow-ups.
#
# Watch-list rationale: docs/active/leg-watcher/results/20260804_ai_legislators_shortlist.md.

congress: 119

sources:
  # ─────────────────────────────────────────────────────────────────────────
  # Bill-level: congress.gov API (needs CONGRESS_API_KEY in .env.local)
  # ─────────────────────────────────────────────────────────────────────────

  # Broad new-bills poller — every bill introduced in the last N days across BOTH
  # chambers; the scorer filters to AI-relevant ones client-side. This is the
  # primary catch for named-bill introductions like H.R. 9363.
  - id: congress-api-poller
    type: congress_api
    chamber: joint
    url: https://api.congress.gov
    params:
      mode: poller
      congress: 119
      limit: 250

  # Tracked-bill latest-action watcher — one detail call per tracked bill listed
  # in keywords.yaml. Runs even after introduction so we see markups, floor
  # actions, and reported-out events on the bills we're already following.
  - id: congress-api-tracked
    type: congress_api
    chamber: joint
    url: https://api.congress.gov
    params:
      mode: tracked
      congress: 119

  # ─────────────────────────────────────────────────────────────────────────
  # House committees — docs.house.gov meeting-feed XML (RSS-shaped)
  # ─────────────────────────────────────────────────────────────────────────
  # Live-verified schema in tests/fixtures/docshouse_sy00_live.xml (2026-08-04).

  - id: docs-house-sy00
    type: structured
    chamber: house
    url: https://docs.house.gov/Committee/RSS.ashx?Code=SY00
    params: {subtype: meeting_feed}   # Full Committee on Science

  - id: docs-house-if00
    type: structured
    chamber: house
    url: https://docs.house.gov/Committee/RSS.ashx?Code=IF00
    params: {subtype: meeting_feed}   # Full Committee on Energy & Commerce

  # ─────────────────────────────────────────────────────────────────────────
  # Chamber-wide floor lookaheads
  # ─────────────────────────────────────────────────────────────────────────
  # DISABLED at v1 boot: selectors need one live-page verification pass.
  # The pages exist and are curl-friendly (verified 2026-08-04); what's not
  # settled yet is a stable entry/title/link/date CSS grouping for each. Enable
  # after populating .selectors from a live page inspection.

  - id: majority-leader-lookahead
    type: structured
    chamber: house
    url: https://www.majorityleader.gov/content/weekly-house-schedule
    params: {subtype: floor_lookahead}
    selectors: {entry: "div.schedule-item", title: "h3", link: "a", date: "span.date"}
    enabled: false   # TODO: verify selectors against the live page before enabling.

  - id: senate-daily-schedule
    type: structured
    chamber: senate
    url: https://www.senate.gov/legislative/schedule/floor_schedule.htm
    params: {subtype: floor_lookahead}
    selectors: {entry: "div.floor-item", title: "h3", link: "a", date: "span.date"}
    enabled: false   # TODO: verify selectors (page is table-heavy, may need restructure).

  # ─────────────────────────────────────────────────────────────────────────
  # Senate committees — press releases (RSS where offered)
  # ─────────────────────────────────────────────────────────────────────────
  # High-tier per shortlist: Commerce (Cruz), Judiciary (Grassley), HSGAC (Paul).
  # Press URLs are the shortlist rationale; RSS endpoints are best-guess and
  # need one live check — shipped disabled until confirmed.

  - id: senate-commerce-majority
    type: rss
    chamber: senate
    url: https://www.commerce.senate.gov/services/majority-rss.aspx
    enabled: false   # TODO: confirm RSS endpoint (page uses ASP.NET, RSS URL may differ).

  - id: senate-commerce-minority
    type: rss
    chamber: senate
    url: https://www.commerce.senate.gov/services/minority-rss.aspx
    enabled: false   # TODO: confirm.

  - id: senate-judiciary
    type: rss
    chamber: senate
    url: https://www.judiciary.senate.gov/press/feed
    enabled: false   # TODO: confirm feed URL.

  - id: senate-hsgac
    type: rss
    chamber: senate
    url: https://www.hsgac.senate.gov/feed/
    enabled: false   # TODO: confirm.

  # ─────────────────────────────────────────────────────────────────────────
  # House committees — press feeds (RSS where offered)
  # ─────────────────────────────────────────────────────────────────────────

  - id: house-science-majority
    type: rss
    chamber: house
    url: https://science.house.gov/rss/press-releases.xml
    enabled: false   # TODO: confirm feed URL; SY00 meeting feed above covers markups already.

