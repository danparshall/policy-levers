# Legislative watcher — source registry
#
# Each source normalizes to Items via one of four adapters (see src/watcher/adapters/).
# Config knobs, per plan Phase 1:
#   id         unique short slug (also the state-file key)
#   type       congress_api | rss | html_diff | structured
#   chamber    house | senate | joint
#   url        endpoint for RSS / html_diff / structured; base for congress_api
#   params     adapter-specific dict:
#              - congress_api: {mode: poller|tracked, congress: 119, [type, number]}
#              - structured:   {subtype: meeting_feed|floor_lookahead}
#   selectors  html_diff / floor_lookahead: {entry, title, link, date}
#   enabled    default true; set false with a comment when a page resists diffing
#
# Sources that need live selector-hunting are shipped with `enabled: false` and a
# TODO comment — the plan explicitly says disable-with-comment rather than burning
# the smoke run on markup-drift. Populate/enable them one at a time in follow-ups.
#
# Watch-list rationale: docs/active/leg-watcher/results/20260804_ai_legislators_shortlist.md.

congress: 119

sources:
  # ─────────────────────────────────────────────────────────────────────────
  # Bill-level: congress.gov API (needs CONGRESS_API_KEY in .env.local)
  # ─────────────────────────────────────────────────────────────────────────

  # Broad new-bills poller — every bill introduced in the last N days across BOTH
  # chambers; the scorer filters to AI-relevant ones client-side. This is the
  # primary catch for named-bill introductions like H.R. 9363.
  - id: congress-api-poller
    type: congress_api
    chamber: joint
    url: https://api.congress.gov
    params:
      mode: poller
      congress: 119
      limit: 250

  # Tracked-bill latest-action watcher — one detail call per tracked bill listed
  # in keywords.yaml. Runs even after introduction so we see markups, floor
  # actions, and reported-out events on the bills we're already following.
  - id: congress-api-tracked
    type: congress_api
    chamber: joint
    url: https://api.congress.gov
    params:
      mode: tracked
      congress: 119

  # ─────────────────────────────────────────────────────────────────────────
  # House committees — docs.house.gov meeting-feed XML (RSS-shaped)
  # ─────────────────────────────────────────────────────────────────────────
  # Live-verified schema in tests/fixtures/docshouse_sy00_live.xml (2026-08-04).

  - id: docs-house-sy00
    type: structured
    chamber: house
    url: https://docs.house.gov/Committee/RSS.ashx?Code=SY00
    params: {subtype: meeting_feed}   # Full Committee on Science

  - id: docs-house-if00
    type: structured
    chamber: house
    url: https://docs.house.gov/Committee/RSS.ashx?Code=IF00
    params: {subtype: meeting_feed}   # Full Committee on Energy & Commerce

  # ─────────────────────────────────────────────────────────────────────────
  # Chamber-wide floor lookaheads
  # ─────────────────────────────────────────────────────────────────────────
  # DISABLED at v1 boot: selectors need one live-page verification pass.
  # The pages exist and are curl-friendly (verified 2026-08-04); what's not
  # settled yet is a stable entry/title/link/date CSS grouping for each. Enable
  # after populating .selectors from a live page inspection.

  - id: majority-leader-lookahead
    type: structured
    chamber: house
    url: https://www.majorityleader.gov/schedule/weekly-schedule.htm
    params: {subtype: floor_lookahead}
    selectors: {entry: "div.schedule-item", title: "h3", link: "a", date: "span.date"}
    enabled: false   # Needs bespoke prose parser (v1.2): page is a Telerik paste — <u>WEEK OF JULY 20</u> headings, day names WITHOUT years, no per-item containers/links (verified 2026-08-11; old /content/weekly-house-schedule URL now 404s — URL updated here). Suspension-calendar signal partially covered by docs.house.gov meeting feeds.

  - id: senate-daily-schedule
    type: structured
    chamber: senate
    url: https://www.senate.gov/legislative/schedule/floor_schedule.htm
    params: {subtype: floor_lookahead}
    selectors: {entry: "article#proceedings_schedule", title: "span.floor-schedule", link: "a", date: "h3"}
    # Server-rendered article pair; entry selector targets ONLY #proceedings_schedule (next meeting) — the second article is "Previous Meeting" and must not match. Verified against real capture 2026-08-11 (fixture senate-daily-schedule.html).

  # ─────────────────────────────────────────────────────────────────────────
  # Senate committees — press releases (RSS where offered)
  # ─────────────────────────────────────────────────────────────────────────
  # High-tier per shortlist: Commerce (Cruz), Judiciary (Grassley), HSGAC (Paul).
  # Press URLs are the shortlist rationale; RSS endpoints are best-guess and
  # need one live check — shipped disabled until confirmed.

  - id: senate-commerce-majority
    type: rss
    chamber: senate
    url: https://www.commerce.senate.gov/services/majority-rss.aspx
    enabled: false   # No RSS found (probe 2026-08-11: majority-rss.aspx, /rss/feeds/, /feed/ all 404/redirect-loop). Permanent-disabled.

  - id: senate-commerce-minority
    type: rss
    chamber: senate
    url: https://www.commerce.senate.gov/services/minority-rss.aspx
    enabled: false   # No RSS found (probe 2026-08-11: 404). Permanent-disabled.

  - id: senate-judiciary
    type: rss
    chamber: senate
    url: https://www.judiciary.senate.gov/press/feed
    enabled: false   # No RSS found (probe 2026-08-11: /press/feed, /feed/, /rss/feeds/ all 404). Permanent-disabled.

  - id: senate-hsgac
    type: rss
    chamber: senate
    url: https://www.hsgac.senate.gov/feed/
    enabled: false   # Real WordPress feed confirmed 2026-08-11 (lastBuildDate current) but ZERO items — cannot fixture-test yet. Re-probe when Congress is in session; enable after first non-empty capture.

  # ─────────────────────────────────────────────────────────────────────────
  # House committees — press feeds (RSS where offered)
  # ─────────────────────────────────────────────────────────────────────────

  - id: house-science-majority
    type: rss
    chamber: house
    url: https://science.house.gov/rss/press-releases.xml
    enabled: false   # No RSS found (probe 2026-08-11: /rss/press-releases.xml, /news/rss.aspx, /rss.xml all 404). Permanent-disabled; SY00 meeting feed above covers markups.

  - id: house-energy-commerce-majority
    type: rss
    chamber: house
    url: https://energycommerce.house.gov/rss/press-releases.xml
    enabled: false   # No RSS found (probe 2026-08-11: rss.aspx returns bare "/news" soft-redirect, others 404). Permanent-disabled; IF00 meeting feed above covers markups.

  # ─────────────────────────────────────────────────────────────────────────
  # Senate member press pages — the "shortlist" (2026-08-04)
  # ─────────────────────────────────────────────────────────────────────────
  # Ranked 1–8 in results/20260804_ai_legislators_shortlist.md. Each senator's
  # office publishes AI material through the press-page listing at the URL below;
  # discussion drafts (the GAAIA failure mode) land here before congress.gov.
  #
  # DISABLED at v1 boot: Senate .senate.gov press-listing pages vary widely in
  # markup (some ASP.NET, some Drupal, some JS-rendered) so per-site selectors
  # need a live pass. Enable one at a time as selectors are captured.
  # The URLs below are the ones the shortlist verified.

  - id: sen-warner-press
    type: html_diff
    chamber: senate
    url: https://www.warner.senate.gov/newsroom/press-releases
    selectors: {entry: "div.ArticleBlock", title: "h3.elementor-heading-title", link: "h3.elementor-heading-title a", date: "time"}
    # WP/Elementor, static HTML; selectors verified against real capture 2026-08-11 (fixture sen-warner-press.html). Ordinal dates ("August 7th, 2026") handled by adapter.

  - id: sen-blackburn-press
    type: html_diff
    chamber: senate
    url: https://www.blackburn.senate.gov/press-releases
    selectors: {entry: "div.element", title: "div.element-title", link: "a", date: "span.element-datetime"}
    # Static HTML; selectors verified against real capture 2026-08-11 (fixture sen-blackburn-press.html). m/d/Y dates ("08/5/2026") handled by adapter. TRUMP AMERICA AI Act discussion-draft workflow — the GAAIA analog.

  - id: sen-cruz-press
    type: html_diff
    chamber: senate
    url: https://www.cruz.senate.gov/newsroom/press-releases
    selectors: {entry: "li.PageList__item", title: "h2.ArticleTitle", link: "a", date: "p.Heading"}
    # Senate PageList CMS; selectors verified against real capture 2026-08-11 (fixture sen-cruz-press.html). Dotted dates ("08.10.2026") handled by adapter. Commerce chair — markup announcements.

  - id: sen-curtis-press
    type: html_diff
    chamber: senate
    url: https://www.curtis.senate.gov/press-releases/
    selectors: {entry: "article.post", title: "h2.entry-title", link: "a", date: "time"}
    enabled: false   # Listing page has NO per-entry dates (verified 2026-08-11); adapter requires a date. /rss/ is a dead 2022 test feed. Needs date-optional or detail-fetch support (v1.2). Freshman AI-signature-issue senator.

  - id: sen-hawley-press
    type: rss
    chamber: senate
    url: https://www.hawley.senate.gov/rss/
    # Real WP press feed, capture 2026-08-11; fixture sen-hawley-press.xml. High-volume AI press page.

  - id: sen-rounds-press
    type: html_diff
    chamber: senate
    url: https://www.rounds.senate.gov/newsroom/press-releases
    selectors: {entry: "li.PageList__item", title: "h2.ArticleTitle", link: "a", date: "p.Heading"}
    # Same PageList CMS as Cruz; verified against real capture 2026-08-11 (fixture sen-rounds-press.html). Working Group original, Armed Services cyber/AI.

  - id: sen-schumer-press
    type: rss
    chamber: senate
    url: https://www.democrats.senate.gov/feed/
    # Senate Dem caucus newsroom feed, capture 2026-08-11; fixture sen-schumer-press.xml. Minority Leader; floor wrap-ups + schedule notices.

  - id: sen-peters-mi-press
    type: html_diff
    chamber: senate
    url: https://www.peters.senate.gov/newsroom/press-releases
    selectors: {entry: "li.PageList__item", title: "h2.ArticleTitle", link: "a", date: "p.Heading"}
    # Same PageList CMS as Cruz; verified against real capture 2026-08-11 (fixture sen-peters-mi-press.html). Gary Peters D-MI, HSGAC ranking.

  # ─────────────────────────────────────────────────────────────────────────
  # House member press pages (the FRONTIER-Act and GAAIA sponsor cluster)
  # ─────────────────────────────────────────────────────────────────────────
  # Rep. Scott Peters (D-CA-50) is the "Peters" on FRONTIER / GAAIA cosponsorship —
  # distinct from Gary Peters (D-MI) above. Added per shortlist verification.
  # Probe history 2026-08-11: two CMS clusters. Fireside sites (Trahan, Franklin)
  # publish real press RSS at /news/rss.aspx — enabled. The evo-Drupal cluster
  # (Obernolte, Scott Peters, Subramanyam, Houchin, Lofgren, Stevens) serves a
  # sitewide /rss.xml that is featured-content/media, NOT press releases (stale
  # 2023-2025 items), and a secondary probe found no press-specific feed
  # (/media/press-releases/feed etc. all 404) — those stay html_diff for Phase 3.

  - id: rep-obernolte-press
    type: html_diff
    chamber: house
    url: https://obernolte.house.gov/media/press-releases
    selectors: {entry: "div.media-body", title: "div.h3 a", link: "div.h3 a", date: "div.row div.col-auto"}
    # evo-Drupal listing, static HTML; selectors verified against real capture 2026-08-11 (fixture rep-obernolte-press.html — pins the FRONTIER introduction release). GAAIA + FRONTIER lead sponsor. (/rss.xml is featured-content, not press.)

  - id: rep-trahan-press
    type: rss
    chamber: house
    url: https://trahan.house.gov/news/rss.aspx
    # RSS confirmed live 2026-08-11; real fixture rep-trahan-press.xml. GAAIA + FRONTIER Dem lead — the literal GAAIA-catcher.

  - id: rep-scott-peters-ca-press
    type: html_diff
    chamber: house
    url: https://scottpeters.house.gov/media/press-releases
    selectors: {entry: "li.press-item", title: "a", link: "a", date: "span.date"}
    enabled: false   # JS-rendered — needs headless-browser adapter (v2). Listing HTML contains zero press links (verified 2026-08-11); /rss.xml is a stale videos feed. FRONTIER/GAAIA cosponsor.

  - id: rep-franklin-press
    type: rss
    chamber: house
    url: https://franklin.house.gov/news/rss.aspx
    # Fireside press RSS, capture 2026-08-11; fixture rep-franklin-press.xml. FRONTIER/GAAIA cosponsor R-FL-18.

  - id: rep-subramanyam-press
    type: html_diff
    chamber: house
    url: https://subramanyam.house.gov/media/press-releases
    selectors: {entry: "div.evo-media-object", title: "div.h5 a", link: "div.h5 a", date: "div.row div.col-auto"}
    # evo-Drupal h5 variant; verified against real capture 2026-08-11 (fixture rep-subramanyam-press.html). FRONTIER/GAAIA cosponsor; "four-alarm fire" quote.

  - id: rep-houchin-press
    type: html_diff
    chamber: house
    url: https://houchin.house.gov/media/press-releases
    selectors: {entry: "div.media-body", title: "div.h3 a", link: "div.h3 a", date: "div.row div.col-auto"}
    # evo-Drupal, same selectors as Obernolte; verified against real capture 2026-08-11 (fixture rep-houchin-press.html). FRONTIER/GAAIA cosponsor; Schrage staffer.

  - id: rep-lofgren-press
    type: html_diff
    chamber: house
    url: https://lofgren.house.gov/media/press-releases
    selectors: {entry: "div.views-row", title: "a.h4 div.h3", link: "a.h4", date: "time"}
    enabled: false   # evo-card listing has no reliable per-entry dates (1 of 10 rows dated, verified 2026-08-11); /rss.xml is featured-content. Needs date-optional support (v1.2). House Science ranking member.

  - id: rep-foushee-press
    type: html_diff
    chamber: house
    url: https://foushee.house.gov/media/press-releases
    selectors: {entry: "li.press-item", title: "a", link: "a", date: "span.date"}
    enabled: false   # Listing renders all 20 h2.title entries as flat siblings in one div — no per-entry containers for the selector model (verified 2026-08-11). No RSS either. Needs sibling-walk parsing (v1.2). Science subcommittee ranking member.

  - id: rep-stevens-press
    type: html_diff
    chamber: house
    url: https://stevens.house.gov/media/press-releases
    selectors: {entry: "div.media-body", title: "div.h3 a", link: "div.h3 a", date: "div.row div.col-auto"}
    # evo-Drupal, same selectors as Obernolte; verified against real capture 2026-08-11 (fixture rep-stevens-press.html). Science AI ally; 2026 Senate run — tone-flag.
