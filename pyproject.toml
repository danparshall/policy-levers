[project]
name = "policy-levers"
version = "0.1.0"
description = "Outreach prioritization and legislative watching for AI policy work"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
watcher = "watcher.run:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
